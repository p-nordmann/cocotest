[project]
name = "cocotest"
version = "0.1.0"
description = "Simple test orchestration framework for cocotb."
readme = "README.md"
authors = [
    { name = "Pierre-Louis Nordmann", email = "pierrelouis.nordmann@gmail.com" },
]
requires-python = ">=3.11"
dependencies = ["cocotb~=2.0"]

[project.scripts]
cocotest = "cocotest.cli:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]
